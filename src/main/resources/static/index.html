<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>企业员工管理系统</title>
    <style>
        :root {
            --bg: #edf5f1;
            --panel: #ffffff;
            --panel-soft: #f8fbf8;
            --text: #17352d;
            --muted: #63746d;
            --line: #dce7df;
            --brand: #15956c;
            --brand-dark: #0f6e50;
            --accent: #2c7be5;
            --accent-soft: #e8f2ff;
            --danger: #b7423a;
            --danger-soft: #fff0ed;
            --ok: #12805c;
            --sidebar: #17352d;
            --shadow: 0 18px 45px rgba(23, 53, 45, 0.12);
            --shadow-soft: 0 8px 24px rgba(23, 53, 45, 0.08);
            --radius: 18px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--text);
            font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif;
            background:
                    radial-gradient(circle at 82% 8%, rgba(44, 123, 229, 0.14), transparent 26%),
                    radial-gradient(circle at 30% 22%, rgba(21, 149, 108, 0.16), transparent 28%),
                    linear-gradient(135deg, rgba(255, 255, 255, 0.75), transparent 38%),
                    var(--bg);
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            opacity: 0.34;
            pointer-events: none;
            background-image:
                    linear-gradient(rgba(23, 53, 45, 0.045) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(23, 53, 45, 0.045) 1px, transparent 1px);
            background-size: 34px 34px;
            mask-image: linear-gradient(180deg, #000 0%, transparent 82%);
        }

        .layout {
            display: grid;
            grid-template-columns: 264px 1fr;
            min-height: 100vh;
        }

        .sidebar {
            position: sticky;
            top: 0;
            align-self: start;
            min-height: 100vh;
            padding: 30px 18px;
            background:
                    radial-gradient(circle at 45% 0, rgba(255, 255, 255, 0.16), transparent 24%),
                    linear-gradient(180deg, rgba(255, 255, 255, 0.08), transparent 28%),
                    var(--sidebar);
            color: #f8fbff;
            box-shadow: var(--shadow);
        }

        .brand {
            margin-bottom: 28px;
            padding: 4px 8px 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.14);
        }

        .brand h1 {
            margin: 0;
            font-size: 23px;
            line-height: 1.3;
        }

        .brand p {
            margin: 8px 0 0;
            color: #b5d7c9;
            font-size: 13px;
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 999px;
            padding: 6px 10px;
            color: #ddf7ed;
            background: rgba(255, 255, 255, 0.08);
            font-size: 12px;
        }

        .brand-badge::before,
        .status::before {
            content: "";
            width: 7px;
            height: 7px;
            border-radius: 999px;
            background: #45e0a5;
            box-shadow: 0 0 0 6px rgba(69, 224, 165, 0.14);
        }

        .nav {
            display: grid;
            gap: 8px;
        }

        .nav button {
            width: 100%;
            border: 0;
            border-radius: 14px;
            padding: 13px 14px;
            text-align: left;
            color: #c4dbd2;
            background: transparent;
            cursor: pointer;
            font-size: 15px;
            transition: background 0.18s ease, transform 0.18s ease, color 0.18s ease;
        }

        .nav button:hover,
        .nav button.active {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.15);
            transform: translateX(3px);
        }

        .nav button.active {
            box-shadow: inset 3px 0 0 #45e0a5;
        }

        .content {
            padding: 30px clamp(20px, 3vw, 40px) 40px;
            overflow-x: hidden;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 20px;
        }

        .topbar h2 {
            margin: 0;
            font-size: 28px;
            letter-spacing: 0;
        }

        .topbar p {
            margin: 8px 0 0;
            color: var(--muted);
            font-size: 14px;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            min-width: 220px;
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 10px 14px;
            font-size: 13px;
            color: var(--muted);
            background: rgba(255, 255, 255, 0.82);
            box-shadow: var(--shadow-soft);
            backdrop-filter: blur(14px);
        }

        .status.success {
            color: var(--ok);
        }

        .status.error {
            color: var(--danger);
        }

        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 16px;
            margin-bottom: 22px;
        }

        .hero-card {
            position: relative;
            display: grid;
            grid-template-columns: minmax(320px, 0.92fr) minmax(360px, 1.08fr);
            align-items: stretch;
            gap: 0;
            min-height: 360px;
            margin-bottom: 22px;
            border: 1px solid rgba(255, 255, 255, 0.72);
            border-radius: 26px;
            background: rgba(255, 255, 255, 0.76);
            box-shadow: var(--shadow);
            overflow: hidden;
            isolation: isolate;
        }

        .hero-card::before {
            content: "";
            position: absolute;
            inset: -1px;
            z-index: -1;
            background:
                    radial-gradient(circle at var(--spotlight-x, 68%) var(--spotlight-y, 22%), rgba(44, 123, 229, 0.22), transparent 24%),
                    linear-gradient(135deg, rgba(21, 149, 108, 0.18), rgba(255, 255, 255, 0));
            opacity: 0.95;
        }

        .hero-copy {
            position: relative;
            z-index: 2;
            padding: clamp(28px, 4vw, 48px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.92), rgba(255, 255, 255, 0.62), transparent);
        }

        .hero-copy span {
            color: var(--brand);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0;
        }

        .hero-copy h3 {
            margin: 12px 0 10px;
            max-width: 560px;
            font-size: clamp(30px, 4vw, 46px);
            line-height: 1.16;
        }

        .hero-copy p {
            margin: 0;
            color: var(--muted);
            line-height: 1.7;
            font-size: 15px;
            max-width: 560px;
        }

        .hero-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 24px;
        }

        .hero-chip-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 22px;
        }

        .hero-chip {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            border: 1px solid rgba(21, 149, 108, 0.18);
            border-radius: 999px;
            padding: 7px 10px;
            color: var(--text);
            background: rgba(255, 255, 255, 0.72);
            font-size: 12px;
            box-shadow: var(--shadow-soft);
        }

        .hero-chip::before {
            content: "";
            width: 8px;
            height: 8px;
            border-radius: 999px;
            background: linear-gradient(135deg, var(--brand), var(--accent));
        }

        .hero-image {
            position: relative;
            min-height: 320px;
            background: #dbeae4;
        }

        .hero-image img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: saturate(1.06) contrast(1.02);
            transform: scale(1.012);
        }

        .hero-image::after {
            content: "";
            position: absolute;
            inset: 0;
            background:
                    linear-gradient(90deg, rgba(255, 255, 255, 0.88) 0%, rgba(255, 255, 255, 0.62) 28%, transparent 58%),
                    linear-gradient(0deg, rgba(23, 53, 45, 0.16), transparent 44%);
            pointer-events: none;
        }

        .metric {
            border: 1px solid rgba(255, 255, 255, 0.72);
            border-radius: 20px;
            padding: 19px;
            background:
                    linear-gradient(145deg, rgba(255, 255, 255, 0.95), rgba(248, 251, 248, 0.82)),
                    var(--panel);
            box-shadow: var(--shadow-soft);
            position: relative;
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .metric::before {
            content: "";
            position: absolute;
            inset: 0 0 auto;
            height: 4px;
            background: linear-gradient(90deg, var(--brand), var(--accent));
        }

        .metric::after {
            content: "";
            position: absolute;
            right: -22px;
            bottom: -28px;
            width: 92px;
            height: 92px;
            border-radius: 999px;
            background: radial-gradient(circle, rgba(44, 123, 229, 0.14), transparent 62%);
        }

        .metric:hover {
            transform: translateY(-3px);
            border-color: rgba(21, 149, 108, 0.28);
            box-shadow: 0 16px 38px rgba(23, 53, 45, 0.14);
        }

        .metric span {
            color: var(--muted);
            font-size: 13px;
        }

        .metric strong {
            display: block;
            margin-top: 8px;
            font-size: 34px;
            letter-spacing: 0;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
            animation: sectionIn 0.24s ease-out;
        }

        .panel {
            border: 1px solid rgba(255, 255, 255, 0.72);
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.88);
            box-shadow: var(--shadow-soft);
            overflow: hidden;
            backdrop-filter: blur(16px);
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 16px 18px;
            border-bottom: 1px solid var(--line);
            background:
                    linear-gradient(90deg, rgba(21, 149, 108, 0.10), rgba(44, 123, 229, 0.06), transparent),
                    rgba(248, 251, 248, 0.86);
        }

        .panel-header h3 {
            margin: 0;
            font-size: 18px;
        }

        .panel-body {
            padding: 18px;
        }

        .panel-body.editing-target {
            animation: editTargetGlow 1.2s ease;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 14px;
        }

        label {
            display: grid;
            gap: 6px;
            color: var(--muted);
            font-size: 13px;
        }

        input,
        select,
        textarea {
            width: 100%;
            border: 1px solid rgba(220, 231, 223, 0.92);
            border-radius: 13px;
            padding: 11px 12px;
            color: var(--text);
            background: rgba(255, 255, 255, 0.88);
            font: inherit;
            transition: border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: 2px solid rgba(21, 149, 108, 0.18);
            border-color: var(--brand);
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(21, 149, 108, 0.08);
        }

        textarea {
            resize: vertical;
            min-height: 40px;
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 16px;
        }

        button.primary,
        button.secondary,
        button.danger {
            border: 0;
            border-radius: 999px;
            padding: 10px 14px;
            cursor: pointer;
            font: inherit;
            transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
        }

        button.primary:hover,
        button.secondary:hover,
        button.danger:hover,
        .row-actions button:hover,
        .pagination button:hover {
            transform: translateY(-1px);
        }

        button.primary {
            color: #ffffff;
            background: linear-gradient(135deg, var(--brand), var(--brand-dark));
            box-shadow: 0 10px 20px rgba(21, 149, 108, 0.22);
        }

        button.primary:hover {
            background: var(--brand-dark);
        }

        button.secondary {
            color: var(--text);
            background: #edf6f2;
        }

        button.danger {
            color: var(--danger);
            background: var(--danger-soft);
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.52;
        }

        button:focus-visible,
        input:focus-visible,
        select:focus-visible,
        textarea:focus-visible {
            outline: 3px solid rgba(44, 123, 229, 0.28);
            outline-offset: 2px;
        }

        .table-toolbar {
            display: grid;
            grid-template-columns: minmax(220px, 1fr) minmax(130px, 180px) minmax(110px, 140px) auto;
            gap: 10px;
            align-items: center;
            padding: 14px 18px;
            border-top: 1px solid var(--line);
            border-bottom: 1px solid var(--line);
            background: rgba(251, 253, 251, 0.86);
        }

        .table-summary {
            color: var(--muted);
            font-size: 13px;
            text-align: right;
            white-space: nowrap;
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 760px;
            font-size: 14px;
        }

        th,
        td {
            padding: 12px 14px;
            border-bottom: 1px solid var(--line);
            text-align: left;
            white-space: nowrap;
        }

        th {
            color: var(--muted);
            background: #fbfdfb;
            font-weight: 600;
        }

        tr:hover td {
            background: #f7fbf8;
        }

        tbody tr {
            animation: rowIn 0.22s ease both;
        }

        .row-actions {
            display: flex;
            gap: 8px;
        }

        .row-actions button {
            border: 0;
            border-radius: 999px;
            padding: 7px 10px;
            cursor: pointer;
            background: #eaf3ef;
        }

        .row-actions button:last-child {
            color: var(--danger);
            background: var(--danger-soft);
        }

        .pagination {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
            padding: 12px 18px;
            color: var(--muted);
            font-size: 13px;
            background: #fbfdfb;
        }

        .pagination button {
            border: 0;
            border-radius: 999px;
            padding: 7px 11px;
            cursor: pointer;
            color: var(--text);
            background: #eaf3ef;
        }

        .statistics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .chart {
            display: grid;
            gap: 12px;
            padding: 18px;
            border-bottom: 1px solid var(--line);
        }

        .chart-row {
            display: grid;
            grid-template-columns: 92px minmax(120px, 1fr) 42px;
            align-items: center;
            gap: 10px;
            font-size: 13px;
        }

        .chart-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--muted);
        }

        .chart-track {
            height: 12px;
            border-radius: 999px;
            background: #e7f0ea;
            overflow: hidden;
        }

        .chart-bar {
            height: 100%;
            min-width: 4px;
            border-radius: 999px;
            background: linear-gradient(90deg, var(--brand), var(--accent));
            transform-origin: left center;
            animation: barGrow 0.56s ease both;
        }

        .chart-count {
            text-align: right;
            font-weight: 700;
        }

        .modal-backdrop {
            position: fixed;
            inset: 0;
            z-index: 30;
            display: grid;
            place-items: center;
            padding: 24px;
            background: rgba(11, 26, 22, 0.48);
            backdrop-filter: blur(10px);
        }

        .modal-backdrop[hidden] {
            display: none;
        }

        .modal {
            width: min(420px, 100%);
            border: 1px solid var(--line);
            border-radius: 22px;
            padding: 24px;
            background: rgba(255, 255, 255, 0.94);
            box-shadow: var(--shadow);
            animation: modalIn 0.18s ease-out;
        }

        .modal h3 {
            margin: 0;
            font-size: 20px;
        }

        .modal p {
            margin: 12px 0 0;
            color: var(--muted);
            line-height: 1.6;
        }

        .toast-stack {
            position: fixed;
            top: 22px;
            right: 22px;
            z-index: 60;
            display: grid;
            gap: 10px;
            width: min(360px, calc(100vw - 32px));
            pointer-events: none;
        }

        .toast {
            display: grid;
            grid-template-columns: auto minmax(0, 1fr) auto;
            gap: 12px;
            align-items: start;
            border: 1px solid rgba(220, 231, 223, 0.9);
            border-radius: 18px;
            padding: 14px 14px;
            color: var(--text);
            background: rgba(255, 255, 255, 0.95);
            box-shadow: var(--shadow);
            backdrop-filter: blur(16px);
            pointer-events: auto;
            animation: toastIn 0.22s ease-out both;
        }

        .toast::before {
            content: "!";
            display: grid;
            place-items: center;
            width: 24px;
            height: 24px;
            border-radius: 999px;
            color: #ffffff;
            background: var(--danger);
            font-weight: 700;
            font-size: 14px;
        }

        .toast.success::before {
            content: "✓";
            background: var(--ok);
        }

        .toast strong {
            display: block;
            margin-bottom: 3px;
            font-size: 14px;
        }

        .toast span {
            display: block;
            color: var(--muted);
            line-height: 1.5;
            font-size: 13px;
            overflow-wrap: anywhere;
        }

        .toast button {
            border: 0;
            padding: 0 4px;
            color: var(--muted);
            background: transparent;
            cursor: pointer;
            font-size: 20px;
            line-height: 1;
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateY(-8px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes sectionIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes rowIn {
            from {
                opacity: 0;
                transform: translateY(4px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes barGrow {
            from {
                transform: scaleX(0);
            }
            to {
                transform: scaleX(1);
            }
        }

        @keyframes modalIn {
            from {
                opacity: 0;
                transform: translateY(8px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes editTargetGlow {
            0% {
                box-shadow: inset 0 0 0 0 rgba(47, 128, 237, 0);
                background: rgba(47, 128, 237, 0);
            }
            35% {
                box-shadow: inset 0 0 0 2px rgba(47, 128, 237, 0.22);
                background: rgba(47, 128, 237, 0.06);
            }
            100% {
                box-shadow: inset 0 0 0 0 rgba(47, 128, 237, 0);
                background: rgba(47, 128, 237, 0);
            }
        }

        /* Pro-grade visual layer */
        :root {
            --bg: #eef4ef;
            --panel: rgba(255, 255, 255, 0.76);
            --panel-soft: rgba(248, 251, 248, 0.68);
            --text: #102620;
            --muted: #687b73;
            --line: rgba(255, 255, 255, 0.54);
            --brand: #0f7662;
            --brand-dark: #0b4f43;
            --accent: #2f80ed;
            --accent-soft: rgba(47, 128, 237, 0.13);
            --gold: #d6a84f;
            --glass: rgba(255, 255, 255, 0.68);
            --glass-strong: rgba(255, 255, 255, 0.82);
            --hairline: rgba(255, 255, 255, 0.72);
            --shadow: 0 28px 80px rgba(20, 45, 38, 0.16);
            --shadow-soft: 0 14px 36px rgba(20, 45, 38, 0.10);
            --inner-light: inset 0 1px 0 rgba(255, 255, 255, 0.72);
            --radius: 26px;
        }

        html {
            color-scheme: light;
            scroll-behavior: smooth;
        }

        body {
            font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "HarmonyOS Sans SC", "MiSans", "PingFang SC", "Microsoft YaHei", sans-serif;
            letter-spacing: 0;
            background:
                    radial-gradient(circle at 14% 12%, rgba(214, 168, 79, 0.18), transparent 28%),
                    radial-gradient(circle at 72% 8%, rgba(47, 128, 237, 0.22), transparent 30%),
                    radial-gradient(circle at 88% 70%, rgba(15, 118, 98, 0.18), transparent 34%),
                    linear-gradient(135deg, #f7fbf8 0%, #edf6f5 45%, #eef3fb 100%);
        }

        body::before {
            opacity: 0.48;
            background-image:
                    linear-gradient(rgba(16, 38, 32, 0.035) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(16, 38, 32, 0.035) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        body::after {
            content: "";
            position: fixed;
            inset: auto -12% -28% -12%;
            z-index: -1;
            height: 46vh;
            pointer-events: none;
            background:
                    radial-gradient(circle at 22% 46%, rgba(47, 128, 237, 0.16), transparent 32%),
                    radial-gradient(circle at 65% 36%, rgba(15, 118, 98, 0.17), transparent 30%),
                    radial-gradient(circle at 82% 55%, rgba(214, 168, 79, 0.13), transparent 24%);
            filter: blur(30px);
            animation: meshDrift 12s ease-in-out infinite alternate;
        }

        .layout {
            grid-template-columns: 292px minmax(0, 1fr);
            gap: 0;
        }

        .sidebar {
            min-height: calc(100vh - 32px);
            margin: 16px 0 16px 16px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 30px;
            padding: 24px 16px;
            background:
                    radial-gradient(circle at 22% 0, rgba(214, 168, 79, 0.18), transparent 24%),
                    radial-gradient(circle at 85% 18%, rgba(47, 128, 237, 0.20), transparent 30%),
                    linear-gradient(180deg, rgba(9, 41, 34, 0.92), rgba(10, 31, 28, 0.88));
            box-shadow: 0 28px 70px rgba(11, 42, 35, 0.22);
            backdrop-filter: blur(26px) saturate(1.15);
        }

        .brand {
            padding: 8px 10px 20px;
        }

        .brand h1 {

    };

    const DEFAULT_STATUS = '等待操作';

    function escapeHtml(value) {
        return String(value ?? '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');
    }

    function escapeAttr(value) {
        return escapeHtml(value);
    }

    function formatEmployeeStatus(value) {
        return employeeStatusLabels[value] || value;
    }

    function formatAttendanceStatus(value) {
        return attendanceStatusLabels[value] || value;
    }

    function setStatus(message, type = '') {
        const status = document.getElementById('statusText');
        window.clearTimeout(state.statusTimer);
        status.textContent = message;
        status.className = `status ${type}`.trim();
        if (type === 'error') {
            showToast('操作失败', message, 'error');
        }
        if (type === 'success') {
            state.statusTimer = window.setTimeout(() => {
                status.textContent = DEFAULT_STATUS;
                status.className = 'status';
            }, 2600);
        }
    }

    function showToast(title, message, type = 'error') {
        const stack = document.getElementById('toastStack');
        const toast = document.createElement('div');
        const id = `toast-${++state.toastId}`;
        toast.className = `toast ${type}`;
        toast.id = id;
        toast.setAttribute('role', type === 'error' ? 'alert' : 'status');
        toast.innerHTML = `
            <div>
                <strong>${escapeHtml(title)}</strong>
                <span>${escapeHtml(message || '请稍后重试')}</span>
            </div>
            <button type="button" aria-label="关闭提醒" data-toast-close="${id}">×</button>
        `;
        stack.appendChild(toast);

        const close = () => toast.remove();
        toast.querySelector('button').addEventListener('click', close);
        window.setTimeout(close, type === 'error' ? 7000 : 3200);
    }

    async function request(url, options = {}) {
        const {headers = {}, ...requestOptions} = options;
        const response = await fetch(url, {
            ...requestOptions,
            headers: {
                Accept: 'application/json',
                ...(requestOptions.body ? {'Content-Type': 'application/json'} : {}),
                ...headers
            }
        });
        const text = await response.text();
        let result = null;

        if (text) {
            try {
                result = JSON.parse(text);
            } catch (error) {
                throw new Error(response.ok ? '响应格式异常' : `请求失败（HTTP ${response.status}）`);
            }
        }

        if (!response.ok) {
            throw new Error(result?.message || `请求失败（HTTP ${response.status}）`);
        }
        if (!result) {
            return null;
        }
        if (result.code !== 0) {
            throw new Error(result.message || '请求失败');
        }
        return result.data;
    }

    function findName(collection, idField, nameField, id) {
        const row = state.data[collection].find(item => Number(item[idField]) === Number(id));
        return row ? row[nameField] : id;
    }

    function getModule(key) {
        return modules.find(item => item.key === key);
    }

    function getTableState(moduleKey) {
        if (!state.tableState[moduleKey]) {
            state.tableState[moduleKey] = {
                search: '',
                column: 'all',
                page: 1,
                pageSize: 10
            };
        }
        return state.tableState[moduleKey];
    }

    function renderNavigation() {
        const nav = document.getElementById('nav');
        const allModules = [...modules, statisticsModule];
        nav.innerHTML = allModules.map(item => {
            const active = item.key === state.activeModule;
            return `

        return `

    function renderTableToolbar(module) {
        const table = getTableState(module.key);
        return `
            <div class="table-toolbar" data-module="${escapeAttr(module.key)}">
                <label class="visually-hidden" for="${escapeAttr(module.key)}Search">搜索${escapeHtml(module.title)}</label>
                <input id="${escapeAttr(module.key)}Search" type="search" value="${escapeAttr(table.search)}" placeholder="搜索${escapeAttr(module.title)}" data-action="table-search" data-module="${escapeAttr(module.key)}">
                <select aria-label="筛选字段" data-action="table-column" data-module="${escapeAttr(module.key)}">
                    <option value="all">全部字段</option>
                    ${module.columns.map(column => `<option value="${escapeAttr(column.name)}" ${table.column === column.name ? 'selected' : ''}>${escapeHtml(column.label)}</option>`).join('')}
                </select>
                <select aria-label="每页条数" data-action="table-page-size" data-module="${escapeAttr(module.key)}">
                    ${PAGE_SIZES.map(size => `<option value="${size}" ${table.pageSize === size ? 'selected' : ''}>每页 ${size} 条</option>`).join('')}

    function renderField(module, field) {
        const required = field.required ? 'required' : '';
        const placeholder = field.placeholder ? `placeholder="${escapeAttr(field.placeholder)}"` : '';
        let input;

        if (field.type === 'select') {
            input = `
                <select name="${escapeAttr(field.name)}" ${required}>
                    <option value="">请选择</option>
                    ${field.options.map(([value, label]) => `<option value="${escapeAttr(value)}">${escapeHtml(label)}</option>`).join('')}
                </select>
            `;
        } else if (field.type === 'department') {
            input = `<select name="${escapeAttr(field.name)}" ${required} data-source="departments"></select>`;
        } else if (field.type === 'position') {
            input = `<select name="${escapeAttr(field.name)}" ${required} data-source="positions"></select>`;
        } else if (field.type === 'employee') {
            input = `<select name="${escapeAttr(field.name)}" ${required} data-source="employees"></select>`;
        } else {
            input = `
                <input
                    name="${escapeAttr(field.name)}"
                    type="${escapeAttr(field.type || 'text')}"
                    ${field.step ? `step="${escapeAttr(field.step)}"` : ''}
                    ${placeholder}
                    ${required}
                >
            `;
        }

        return `<label>${escapeHtml(field.label)}${input}</label>`;
    }

    function renderDependentSelects() {
        document.querySelectorAll('select[data-source]').forEach(select => {
            const source = select.dataset.source;
            const value = select.value;
            let options = '<option value="">请选择</option>';
            if (source === 'departments') {
                options += state.data.departments.map(item => `<option value="${escapeAttr(item.deptId)}">${escapeHtml(item.deptName)}</option>`).join('');
            }
            if (source === 'positions') {
                options += state.data.positions.map(item => `<option value="${escapeAttr(item.positionId)}">${escapeHtml(item.positionName)}</option>`).join('');
            }
            if (source === 'employees') {
                options += state.data.employees.map(item => `<option value="${escapeAttr(item.empId)}">${escapeHtml(item.empName)}</option>`).join('');
            }
            select.innerHTML = options;
            select.value = value;
        });

    function getCellValue(module, column, row) {
        const raw = row[column.name];
        return column.render ? column.render(raw, row) : raw;
    }

    function getFilteredRows(module) {
        const table = getTableState(module.key);
        const query = table.search.trim().toLowerCase();
        if (!query) {
            return state.data[module.key];
        }

        const columns = table.column === 'all'
            ? module.columns
            : module.columns.filter(column => column.name === table.column);

        return state.data[module.key].filter(row => columns.some(column => {
            const value = getCellValue(module, column, row);
            return String(value ?? '').toLowerCase().includes(query);
        }));
    }

    function renderTable(module) {
        const tbody = document.getElementById(`${module.key}Table`);
        const pagination = document.getElementById(`${module.key}Pagination`);
        const summary = document.getElementById(`${module.key}Summary`);
        const table = getTableState(module.key);
        const rows = getFilteredRows(module);
        const totalPages = Math.max(Math.ceil(rows.length / table.pageSize), 1);

        table.page = Math.min(Math.max(table.page, 1), totalPages);
        const start = (table.page - 1) * table.pageSize;
        const pageRows = rows.slice(start, start + table.pageSize);

        tbody.innerHTML = pageRows.length ? pageRows.map(row => {
            const id = row[module.idField];
            return `
                <tr>
                    ${module.columns.map(column => `<td>${escapeHtml(getCellValue(module, column, row))}</td>`).join('')}
                    <td>
                        <div class="row-actions">
                            <button type="button" data-action="edit-row" data-module="${escapeAttr(module.key)}" data-id="${escapeAttr(id)}">编辑</button>
                            <button type="button" data-action="delete-row" data-module="${escapeAttr(module.key)}" data-id="${escapeAttr(id)}">删除</button>
                        </div>
                    </td>
                </tr>
            `;
        }).join('') : `<tr><td colspan="${module.columns.length + 1}">${state.data[module.key].length ? '没有匹配数据' : '暂无数据'}</td></tr>`;

        const shownStart = rows.length ? start + 1 : 0;
        const shownEnd = rows.length ? Math.min(start + table.pageSize, rows.length) : 0;
        summary.textContent = `共 ${rows.length} 条，显示 ${shownStart}-${shownEnd} 条`;
        pagination.innerHTML = `
            <button type="button" data-action="table-prev" data-module="${escapeAttr(module.key)}" ${table.page <= 1 ? 'disabled' : ''}>上一页</button>
            <span>第 ${table.page} / ${totalPages} 页</span>
            <button type="button" data-action="table-next" data-module="${escapeAttr(module.key)}" ${table.page >= totalPages ? 'disabled' : ''}>下一页</button>
        `;
    }

        positionTable.innerHTML = renderStatisticsRows(state.data.statisticsByPosition);

    function renderStatisticsChart(rows) {
        if (!rows.length) {
            return '<div class="chart-row"><span class="chart-name">暂无数据</span><div class="chart-track"></div><span class="chart-count">0</span></div>';
        }
        const max = Math.max(...rows.map(row => Number(row.employeeCount) || 0), 1);
        return rows.map(row => {
            const count = Number(row.employeeCount) || 0;
            const width = Math.max((count / max) * 100, count > 0 ? 8 : 0);
            return `
                <div class="chart-row">
                    <span class="chart-name" title="${escapeAttr(row.name)}">${escapeHtml(row.name)}</span>
                    <div class="chart-track">
                        <div class="chart-bar" style="width: ${width}%"></div>
                    </div>
                    <span class="chart-count">${escapeHtml(count)}</span>
                </div>
            `;
        }).join('');

    function renderMetrics() {
        animateNumber(document.getElementById('metricDepartments'), state.data.departments.length);
        animateNumber(document.getElementById('metricPositions'), state.data.positions.length);
        animateNumber(document.getElementById('metricEmployees'), state.data.employees.length);
        animateNumber(document.getElementById('metricAttendance'), state.data.attendance.length);

    function animateNumber(element, target) {
        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const start = Number(element.dataset.value || element.textContent || 0);
        const end = Number(target) || 0;
        element.dataset.value = String(end);

        if (reduceMotion || start === end) {
            element.textContent = end;
            return;
        }

        const startedAt = performance.now();
        const duration = 520;

        function frame(now) {
            const progress = Math.min((now - startedAt) / duration, 1);
            const eased = 1 - Math.pow(1 - progress, 3);
            element.textContent = Math.round(start + (end - start) * eased);
            if (progress < 1) {
                requestAnimationFrame(frame);
            }
        }

        requestAnimationFrame(frame);
    }

    function switchModule(key) {
        state.activeModule = key;
        const current = [...modules, statisticsModule].find(item => item.key === key);
        document.getElementById('pageTitle').textContent = current.title;
        document.getElementById('pageDesc').textContent = current.desc;

        document.querySelectorAll('.section').forEach(section => section.classList.remove('active'));
        document.getElementById(`${key}Section`).classList.add('active');
        renderNavigation();
    }

    function readPayload(module) {
        const form = document.getElementById(`${module.key}Form`);
        const formData = new FormData(form);
        const payload = {};
        module.fields.forEach(field => {
            const rawValue = formData.get(field.name);
            if (rawValue === '') {
                payload[field.name] = null;
                return;
            }
            if (field.type === 'number' || ['department', 'position', 'employee'].includes(field.type)) {
                payload[field.name] = Number(rawValue);
                return;
            }
            payload[field.name] = rawValue;
        });
        return payload;
    }

    function reportInvalidField(event, module) {
        const field = module.fields.find(item => item.name === event.target.name);
        const label = field ? field.label : '表单字段';
        const message = event.target.validity.valueMissing
            ? `请填写「${label}」后再提交。`
            : `请检查「${label}」的输入格式。`;
        setStatus(message, 'error');
    }

    async function submitForm(event, module) {
        event.preventDefault();
        if (!event.target.checkValidity()) {
            event.target.reportValidity();
            return;
        }
        const id = state.editing[module.key];
        const payload = readPayload(module);
        const url = id ? `${module.endpoint}/${id}` : module.endpoint;
        const method = id ? 'PUT' : 'POST';

        try {
            await request(url, {method, body: JSON.stringify(payload)});
            setStatus(id ? '修改成功' : '新增成功', 'success');
            resetForm(module);
            await refreshModule(module.key);
            await refreshStatistics(false);
        } catch (error) {
            setStatus(error.message, 'error');
        }
    }

    function editRow(moduleKey, id) {
        const module = getModule(moduleKey);
        const row = state.data[module.key].find(item => Number(item[module.idField]) === Number(id));
        if (!row) {
            setStatus('未找到要编辑的数据', 'error');
            return;
        }

        const form = document.getElementById(`${module.key}Form`);
        module.fields.forEach(field => {
            const input = form.elements[field.name];
            if (input) {
                input.value = row[field.name] ?? '';
            }
        });

        state.editing[module.key] = id;
        document.getElementById(`${module.key}Submit`).textContent = '保存修改';
        setStatus(`正在编辑 ${module.title} ID: ${id}`);
        scrollToEditForm(module);
    }

    function scrollToEditForm(module) {
        const form = document.getElementById(`${module.key}Form`);
        const panelBody = form.closest('.panel-body');
        const firstField = form.querySelector('input, select, textarea');
        const topbar = document.querySelector('.topbar');
        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const stickyOffset = (topbar?.getBoundingClientRect().height || 0) + 18;
        const targetTop = panelBody.getBoundingClientRect().top + window.scrollY - stickyOffset;

        panelBody.classList.remove('editing-target');
        void panelBody.offsetWidth;
        panelBody.classList.add('editing-target');

        window.scrollTo({
            top: Math.max(targetTop, 0),
            behavior: reduceMotion ? 'auto' : 'smooth'
        });

        window.setTimeout(() => {
            firstField?.focus({preventScroll: true});
            panelBody.classList.remove('editing-target');
        }, reduceMotion ? 0 : 420);
    }

    function describeRow(module, id) {
        const row = state.data[module.key].find(item => Number(item[module.idField]) === Number(id));
        if (!row) {
            return `${module.title} ID: ${id}`;
        }
        const nameColumn = module.columns.find(column => /name/i.test(column.name)) || module.columns[1] || module.columns[0];
        return `${module.title}「${getCellValue(module, nameColumn, row) ?? id}」`;
    }

    function deleteRow(moduleKey, id) {
        const module = getModule(moduleKey);
        state.pendingDelete = {moduleKey, id};
        document.getElementById('deleteModalDesc').textContent = `确认删除 ${describeRow(module, id)} 吗？删除后无法恢复。`;
        document.getElementById('deleteModal').hidden = false;
        document.getElementById('confirmDeleteButton').focus();
    }

    function closeDeleteDialog() {
        state.pendingDelete = null;
        document.getElementById('deleteModal').hidden = true;
    }

    async function confirmDelete() {
        if (!state.pendingDelete) {
            return;
        }
        const {moduleKey, id} = state.pendingDelete;
        const module = getModule(moduleKey);

        try {
            await request(`${module.endpoint}/${id}`, {method: 'DELETE'});
            closeDeleteDialog();
            setStatus('删除成功', 'success');
            await refreshModule(module.key);
            await refreshStatistics(false);
        } catch (error) {
            setStatus(error.message, 'error');
        }
    }

    function resetForm(module) {
        const form = document.getElementById(`${module.key}Form`);
        form.reset();
        delete state.editing[module.key];
        document.getElementById(`${module.key}Submit`).textContent = '新增';
    }

    async function refreshModule(key) {
        const module = getModule(key);
        try {
            state.data[key] = await request(module.endpoint);
            renderDependentSelects();
            renderTable(module);
            renderMetrics();
            setStatus(`${module.title}已刷新`, 'success');
        } catch (error) {
            setStatus(error.message, 'error');
        }
    }

    async function loadStatisticsData() {
        const [byDepartment, byPosition] = await Promise.all([
            request('/api/statistics/employees-by-department'),
            request('/api/statistics/employees-by-position')
        ]);
        state.data.statisticsByDepartment = byDepartment;
        state.data.statisticsByPosition = byPosition;
        renderStatisticsTables();
    }

    async function refreshStatistics(showStatus = true) {
        try {
            await loadStatisticsData();
            if (showStatus) {
                setStatus('统计已刷新', 'success');
            }
        } catch (error) {
            setStatus(error.message, 'error');
            throw error;
        }
    }

    async function loadAll() {
        document.body.classList.add('is-loading');
        setStatus('正在加载数据......');
        try {
            const [moduleResults] = await Promise.all([
                Promise.all(modules.map(module => request(module.endpoint))),
                loadStatisticsData()
            ]);
            modules.forEach((module, index) => {
                state.data[module.key] = moduleResults[index];
            });
            renderDependentSelects();
            modules.forEach(renderTable);
            renderMetrics();
            setStatus('数据加载完成', 'success');
        } catch (error) {
            setStatus(error.message, 'error');
        } finally {
            document.body.classList.remove('is-loading');
        }
    }

    function bindSectionActions() {
        const container = document.getElementById('sections');
        container.addEventListener('input', event => {
            if (event.target.dataset.action !== 'table-search') {
                return;
            }
            const module = getModule(event.target.dataset.module);
            const table = getTableState(module.key);
            table.search = event.target.value;
            table.page = 1;
            renderTable(module);
        });

        container.addEventListener('change', event => {
            const action = event.target.dataset.action;
            const module = getModule(event.target.dataset.module);
            if (!module) {
                return;
            }
            const table = getTableState(module.key);
            if (action === 'table-column') {
                table.column = event.target.value;
                table.page = 1;
                renderTable(module);
            }
            if (action === 'table-page-size') {
                table.pageSize = Number(event.target.value);
                table.page = 1;
                renderTable(module);
            }
        });

        container.addEventListener('click', event => {
            const button = event.target.closest('button[data-action]');
            if (!button) {
                return;
            }

            const action = button.dataset.action;
            const module = getModule(button.dataset.module);
            if (action === 'refresh-statistics') {
                refreshStatistics().catch(() => {});
                return;
            }
            if (!module) {
                return;
            }
            if (action === 'refresh-module') {
                refreshModule(module.key);
            }
            if (action === 'edit-row') {
                editRow(module.key, button.dataset.id);
            }
            if (action === 'delete-row') {
                deleteRow(module.key, button.dataset.id);
            }
            if (action === 'table-prev' || action === 'table-next') {
                const table = getTableState(module.key);
                table.page += action === 'table-prev' ? -1 : 1;
                renderTable(module);
            }
        });
    }

    function bindDeleteDialog() {
        document.getElementById('confirmDeleteButton').addEventListener('click', confirmDelete);
        document.getElementById('cancelDeleteButton').addEventListener('click', closeDeleteDialog);
        document.getElementById('deleteModal').addEventListener('click', event => {
            if (event.target.id === 'deleteModal') {
                closeDeleteDialog();
            }
        });
        document.addEventListener('keydown', event => {
            if (event.key === 'Escape' && !document.getElementById('deleteModal').hidden) {
                closeDeleteDialog();
            }
        });
    }

    function bindGlobalActions() {
        document.addEventListener('click', event => {
            const button = event.target.closest('button[data-action]');
            if (!button) {
                return;
            }
            if (button.dataset.action === 'refresh-all') {
                loadAll();
            }
            if (button.dataset.action === 'open-statistics') {
                switchModule('statistics');
                document.getElementById('statisticsSection').scrollIntoView({behavior: 'smooth', block: 'start'});
            }
        });
    }

    function enhanceHeroSpotlight() {
        const hero = document.querySelector('.hero-card');
        if (!hero) {
            return;
        }
        hero.addEventListener('pointermove', event => {
            const rect = hero.getBoundingClientRect();
            const x = ((event.clientX - rect.left) / rect.width) * 100;
            const y = ((event.clientY - rect.top) / rect.height) * 100;
            hero.style.setProperty('--spotlight-x', `${x}%`);
            hero.style.setProperty('--spotlight-y', `${y}%`);
        });
    }

    function enhanceSurfaceGlow() {
        document.querySelectorAll('.hero-card, .metric, .panel').forEach(surface => {
            surface.addEventListener('pointermove', event => {
                const rect = surface.getBoundingClientRect();
                const x = ((event.clientX - rect.left) / rect.width) * 100;
                const y = ((event.clientY - rect.top) / rect.height) * 100;
                surface.style.setProperty('--card-x', `${x}%`);
                surface.style.setProperty('--card-y', `${y}%`);
            });
        });
    }

    renderNavigation();
    renderSections();
    bindGlobalActions();
    enhanceHeroSpotlight();
    enhanceSurfaceGlow();
    loadAll();
</script>
</body>
</html>
